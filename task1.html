<!DOCTYPE html>
<html lang="en">
    <link rel="icon" type="image/x-icon" href="download.png">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f4f6f8;
        color: #222;
    }

    header {
        background: linear-gradient(135deg, #f03ef0, #5af388);
        color: rgb(252, 3, 3);
        text-align: center;
        padding: 35px 20px;
    }

    header h1 {
        font-size: 35px;
        margin-bottom: 10px;
    }

    header p {
        opacity: 0.9;
    }

    .filters {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        padding: 25px 15px;
    }

    .filter-btn {
        border: none;
        padding: 10px 20px;
        border-radius: 25px;
        background: white;
        color: #333;
        cursor: pointer;
        font-size: 15px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        transition: 0.3s;
    }

    .filter-btn:hover,
    .filter-btn.active {
        background: #2a5298;
        color: white;
        transform: translateY(-2px);
    }

    .gallery {
        max-width: 1200px;
        margin: auto;
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
    }

    .gallery-item {
        position: relative;
        overflow: hidden;
        border-radius: 15px;
        height: 250px;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        transition: 0.4s ease;
    }

    .gallery-item:hover {
        transform: translateY(-8px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: transform 0.5s ease;
    }

    .gallery-item:hover img {
        transform: scale(1.12);
    }

    .overlay {
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0);
        display: flex;
        align-items: flex-end;
        padding: 20px;
        transition: 0.4s ease;
    }

    .gallery-item:hover .overlay {
        background: rgba(0,0,0,0.45);
    }

    .overlay h3 {
        color: white;
        transform: translateY(30px);
        opacity: 0;
        transition: 0.4s ease;
    }

    .gallery-item:hover .overlay h3 {
        transform: translateY(0);
        opacity: 1;
    }

    .hide {
        display: none;
    }

    .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.9);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 20px;
    }

    .lightbox.active {
        display: flex;
        animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }

    .lightbox-content {
        position: relative;
        max-width: 900px;
        width: 100%;
        text-align: center;
    }

    #lightbox-img {
        max-width: 100%;
        max-height: 80vh;
        border-radius: 10px;
        animation: zoomIn 0.3s ease;
    }

    @keyframes zoomIn {
        from {
            transform: scale(0.8);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    .close {
        position: absolute;
        top: -45px;
        right: 0;
        color: white;
        font-size: 35px;
        cursor: pointer;
        transition: 0.3s;
    }

    .close:hover {
        transform: rotate(90deg);
        color: #ff5252;
    }

    .nav-btn {
        position: fixed;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255,255,255,0.2);
        color: white;
        border: none;
        width: 55px;
        height: 55px;
        border-radius: 50%;
        font-size: 30px;
        cursor: pointer;
        transition: 0.3s;
    }

    .nav-btn:hover {
        background: rgba(255,255,255,0.4);
    }

    .prev {
        left: 30px;
    }

    .next {
        right: 30px;
    }

    .image-counter {
        color: white;
        margin-top: 15px;
        font-size: 16px;
    }

    @media (max-width: 768px) {
        header h1 {
            font-size: 27px;
        }

        .gallery {
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 12px;
        }

        .gallery-item {
            height: 200px;
        }

        .nav-btn {
            width: 45px;
            height: 45px;
            font-size: 25px;
        }

        .prev {
            left: 10px;
        }

        .next {
            right: 10px;
        }
    }

    @media (max-width: 480px) {
        .gallery {
            grid-template-columns: 1fr;
        }

        .gallery-item {
            height: 240px;
        }

        .filter-btn {
            padding: 8px 15px;
            font-size: 14px;
        }
    }
</style>

</head>

<body>
<header>
    <h1>My Image Gallery</h1>
    <p>Explore beautiful images with smooth animations</p>
</header>

<div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="nature">Nature</button>
    <button class="filter-btn" data-filter="city">City</button>
    <button class="filter-btn" data-filter="animals">Animals</button>
</div>

<div class="gallery">

    <div class="gallery-item nature">
        <img src="https://picsum.photos/id/10/800/600" alt="Nature">
        <div class="overlay">
            <h3>Beautiful Nature</h3>
        </div>
    </div>

    <div class="gallery-item city">
        <img src="https://picsum.photos/id/1011/800/600" alt="City">
        <div class="overlay">
            <h3>Modern City</h3>
        </div>
    </div>

    <div class="gallery-item animals">
        <img src="https://picsum.photos/id/237/800/600" alt="Animal">
        <div class="overlay">
            <h3>Lovely Dog</h3>
        </div>
    </div>

    <div class="gallery-item nature">
        <img src="https://picsum.photos/id/15/800/600" alt="Nature">
        <div class="overlay">
            <h3>Mountain View</h3>
        </div>
    </div>

    <div class="gallery-item city">
        <img src="https://picsum.photos/id/1031/800/600" alt="City">
        <div class="overlay">
            <h3>City Architecture</h3>
        </div>
    </div>

    <div class="gallery-item animals">
        <img src="https://picsum.photos/id/219/800/600" alt="Animal">
        <div class="overlay">
            <h3>Wild Animal</h3>
        </div>
    </div>

    <div class="gallery-item nature">
        <img src="https://picsum.photos/id/28/800/600" alt="Nature">
        <div class="overlay">
            <h3>Forest Beauty</h3>
        </div>
    </div>

    <div class="gallery-item city">
        <img src="https://picsum.photos/id/1033/800/600" alt="City">
        <div class="overlay">
            <h3>Urban Life</h3>
        </div>
    </div>

</div>

<div class="lightbox" id="lightbox">

    <div class="lightbox-content">

        <span class="close" id="closeBtn">&times;</span>

        <img id="lightbox-img" src="" alt="Gallery Image">

        <div class="image-counter" id="imageCounter"></div>

    </div>

    <button class="nav-btn prev" id="prevBtn">&#10094;</button>
    <button class="nav-btn next" id="nextBtn">&#10095;</button>

</div>

<script>

    const galleryItems = document.querySelectorAll(".gallery-item");
    const filterButtons = document.querySelectorAll(".filter-btn");

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const closeBtn = document.getElementById("closeBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const imageCounter = document.getElementById("imageCounter");

    let currentIndex = 0;

    function getVisibleItems() {
        return [...galleryItems].filter(item =>
            !item.classList.contains("hide")
        );
    }

    function openLightbox(index) {

        const visibleItems = getVisibleItems();

        currentIndex = index;

        const image = visibleItems[currentIndex].querySelector("img");

        lightboxImg.src = image.src;
        lightboxImg.alt = image.alt;

        imageCounter.textContent =
            `${currentIndex + 1} / ${visibleItems.length}`;

        lightbox.classList.add("active");
    }

    function updateLightbox() {

        const visibleItems = getVisibleItems();

        if (currentIndex >= visibleItems.length) {
            currentIndex = 0;
        }

        if (currentIndex < 0) {
            currentIndex = visibleItems.length - 1;
        }

        const image = visibleItems[currentIndex].querySelector("img");

        lightboxImg.style.opacity = "0";

        setTimeout(() => {
            lightboxImg.src = image.src;
            lightboxImg.alt = image.alt;

            lightboxImg.style.opacity = "1";

            imageCounter.textContent =
                `${currentIndex + 1} / ${visibleItems.length}`;

        }, 150);
    }

    galleryItems.forEach((item) => {

        item.addEventListener("click", () => {

            const visibleItems = getVisibleItems();

            const index = visibleItems.indexOf(item);

            openLightbox(index);

        });

    });

    nextBtn.addEventListener("click", () => {

        currentIndex++;

        updateLightbox();

    });

    prevBtn.addEventListener("click", () => {

        currentIndex--;

        updateLightbox();

    });

    closeBtn.addEventListener("click", () => {

        lightbox.classList.remove("active");

    });

    lightbox.addEventListener("click", (e) => {

        if (e.target === lightbox) {
            lightbox.classList.remove("active");
        }

    });

    document.addEventListener("keydown", (e) => {

        if (!lightbox.classList.contains("active")) return;

        if (e.key === "ArrowRight") {

            currentIndex++;
            updateLightbox();

        }

        if (e.key === "ArrowLeft") {

            currentIndex--;
            updateLightbox();

        }

        if (e.key === "Escape") {

            lightbox.classList.remove("active");

        }

    });

    filterButtons.forEach(button => {

        button.addEventListener("click", () => {

            filterButtons.forEach(btn =>
                btn.classList.remove("active")
            );

            button.classList.add("active");

            const filter = button.getAttribute("data-filter");

            galleryItems.forEach(item => {

                if (
                    filter === "all" ||
                    item.classList.contains(filter)
                ) {

                    item.classList.remove("hide");

                } else {

                    item.classList.add("hide");

                }

            });

        });

    });

</script>

</body>
</html>
